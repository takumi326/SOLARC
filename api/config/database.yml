# PostgreSQL with pg adapter.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || "postgresql://postgres.rgpfsbgcaidldwjuvmbo:facadafafsd@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres" %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] || "postgresql://postgres.rgpfsbgcaidldwjuvmbo:facadafafsd@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres" %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
