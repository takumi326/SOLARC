<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="3">
    <title>SOLARC — 起動中</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        background: linear-gradient(145deg, #f8fafc 0%, #e0f2fe 45%, #f0fdf4 100%);
        color: #334155;
        padding: 1.5rem;
      }
      .card {
        text-align: center;
        max-width: 22rem;
        width: 100%;
        padding: 2.5rem 2rem;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(8px);
      }
      .brand {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #0f172a;
        margin-bottom: 0.25rem;
      }
      .tagline {
        font-size: 0.8rem;
        color: #64748b;
        margin-bottom: 2rem;
      }
      .stage {
        position: relative;
        width: 9rem;
        height: 9rem;
        margin: 0 auto 1.75rem;
      }
      .orbit {
        position: absolute;
        inset: 0;
        animation: orbit 2.4s linear infinite;
      }
      .cat {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.25rem;
        height: 2.25rem;
        margin: -1.125rem 0 0 -1.125rem;
        font-size: 1.75rem;
        line-height: 2.25rem;
        text-align: center;
        transform: rotate(var(--angle)) translateY(-3.25rem) rotate(calc(-1 * var(--angle)));
      }
      .cat:nth-child(1) { --angle: 0deg; }
      .cat:nth-child(2) { --angle: 90deg; }
      .cat:nth-child(3) { --angle: 180deg; }
      .cat:nth-child(4) { --angle: 270deg; }
      .center-paw {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .message {
        font-size: 1.05rem;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 0.35rem;
      }
      .sub {
        font-size: 0.85rem;
        color: #64748b;
        line-height: 1.5;
      }
      .dots {
        display: inline-flex;
        gap: 0.3rem;
        margin-top: 1.25rem;
      }
      .dots span {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: #38bdf8;
        animation: bounce 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes orbit {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
        40% { transform: translateY(-0.35rem); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="brand">SOLARC</p>
      <p class="tagline">収支の予実をまとめる</p>
      <div class="stage" aria-hidden="true">
        <div class="orbit">
          <span class="cat">🐱</span>
          <span class="cat">😺</span>
          <span class="cat">😸</span>
          <span class="cat">🐈</span>
        </div>
        <div class="center-paw">🐾</div>
      </div>
      <p class="message">サーバー起動中</p>
      <p class="sub">ねこが準備しています。<br>少々お待ちください…</p>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>
    <script>
      (function () {
        function probe() {
          fetch("/up", { cache: "no-store" })
            .then(function (r) {
              if (r.ok) location.replace("/");
            })
            .catch(function () {});
        }
        probe();
        setInterval(probe, 2000);
      })();
    </script>
  </body>
</html>
