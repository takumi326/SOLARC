# Render Blueprint の例（このファイル名は render.yaml にコピーして使うか、
# ダッシュボードで同等の設定を手動で入れてください）。
#
# 既に Web サービスと Postgres がある場合は、マージせず
# 「Pre-Deploy Command」と環境変数だけ参考にしてください。
#
# https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: solarc-postgres
    databaseName: solarc
    user: solarc_user

services:
  - type: web
    name: solarc-api
    runtime: docker
    plan: starter
    dockerfilePath: api/Dockerfile
    dockerContext: api
    preDeployCommand: bash bin/render-release
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solarc-postgres
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      # - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET（Rails HTML ログイン）
      # - ALLOWED_HOSTS（例: solarc.onrender.com）
      # - ALLOWED_EMAILS（空なら allowlist なし）
      # - SUPABASE_URL（/api/* の JWT 検証用。HTML ログインのみなら未使用可）
